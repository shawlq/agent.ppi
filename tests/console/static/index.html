<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PuppyPi Console</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div id="viewport">
    <img id="camera" alt="PuppyPi camera" />
    <div id="camera-overlay" class="camera-overlay">请先加载 Agent</div>
  </div>

  <div id="agent-bar" class="agent-bar">
    <label class="agent-label" for="agent-select">Agent</label>
    <select id="agent-select" class="agent-select" aria-label="选择 Agent">
      <option value="">选择 *_agent…</option>
    </select>
    <button id="agent-load-btn" class="btn-connect" type="button">加载</button>
  </div>

  <aside id="panel" class="panel">
    <section class="panel-section">
      <h2>状态</h2>
      <div id="health-line" class="health-line">
        <span id="health-dot" class="dot"></span>
        <span id="health-text">未加载 Agent</span>
      </div>
      <p id="robot-meta" class="hint"></p>
      <p id="action-status" class="hint action-status"></p>
    </section>

    <section class="panel-section">
      <button id="actions-toggle" class="toggle" type="button" aria-expanded="true">
        指令列表 <span class="chevron">▾</span>
      </button>
      <div id="actions-body" class="actions-body">
        <div id="actions-list" class="actions-list"></div>
        <div id="actions-resize" class="resize-handle" title="拖拽调整高度"></div>
      </div>
    </section>

    <section class="panel-section">
      <div class="queue-header">
        <h2>指令队列</h2>
        <button id="queue-clear" type="button" class="btn-ghost">清空</button>
      </div>
      <ul id="queue-list" class="queue-list"></ul>
      <p id="queue-empty" class="hint">队列为空，点击指令加入</p>
    </section>
  </aside>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <div id="hint-bar" class="hint-bar">加载 Agent → 选择动作 → 入队执行</div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>

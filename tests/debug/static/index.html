<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runtime Debug</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <header id="topbar" class="topbar">
    <div class="brand">Runtime Debug</div>
    <div class="connect-row">
      <label for="agent-select">Agent</label>
      <select id="agent-select" aria-label="选择 Agent"></select>
      <button id="btn-connect" type="button" class="btn primary">连接</button>
      <button id="btn-disconnect" type="button" class="btn" disabled>断开</button>
      <span id="status-dot" class="dot" title="未连接"></span>
      <span id="status-text" class="status-text">未连接</span>
    </div>
  </header>

  <main id="board-host" class="board-host"></main>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
